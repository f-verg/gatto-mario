<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Il gatto Mario</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main>
      <h1>Il gatto Mario</h1>
      <canvas id="game" width="960" height="540" aria-label="Gioco Il gatto Mario"></canvas>
      <div class="controls" aria-label="Controlli di gioco">
        <div class="movement-controls">
          <button type="button" data-action="left" aria-label="Muovi a sinistra">←</button>
          <button type="button" data-action="right" aria-label="Muovi a destra">→</button>
        </div>
        <div class="action-controls">
          <button type="button" data-action="jump" aria-label="Salta">Salta</button>
          <button type="button" data-action="shoot" aria-label="Spara">Spara</button>
        </div>
      </div>
      <p>Usa ← → / A D, Spazio e X oppure i controlli touch.</p>
    </main>
    <script type="module" src="src/main.js"></script>
  </body>
</html>
