<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Il gatto Mario</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main>
      <h1>Il gatto Mario</h1>
      <canvas id="game" width="960" height="540" aria-label="Gioco Il gatto Mario"></canvas>
      <p>Usa ← → / A D, Spazio e X. Su touch: tieni e scorri lateralmente per muoverti, scorri in alto per saltare e in basso per sparare.</p>
      <button type="button" id="music-toggle" class="music-toggle" aria-pressed="false">🔈 Musica</button>
    </main>
    <script type="module" src="src/main.js"></script>
  </body>
